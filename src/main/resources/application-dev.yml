spring:
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            authorization-grant-type: ${GOOGLE_AUTHORIZATION_GRANT_TYPE}
            scope:
              - email
              - profile

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${KAKAO_REDIRECT_URI}
            authorization-grant-type: ${KAKAO_AUTHORIZATION_GRANT_TYPE}
            client-name: Kakao
            scope:
              - profile_image
              - profile_nickname
              - account_email

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: ${NAVER_REDIRECT_URI}
            authorization-grant-type: ${NAVER_AUTHORIZATION_GRANT_TYPE}
            client-name: Naver
            scope:
                - profile_image
                - name
                - email
                -
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            redirect-uri: ${FACEBOOK_REDIRECT_URI}
            authorization-grant-type: ${FACEBOOK_AUTHORIZATION_GRANT_TYPE}
            scope:
                - email
                - public_profile

          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            redirect-uri: ${GITHUB_REDIRECT_URI}
            authorization-grant-type: ${GITHUB_AUTHORIZATION_GRANT_TYPE}
            scope:
                - user:email
                - read:user
                - user:profile

        # AT을 Authorization Server에게 발급 받은 후, 해당 AT로 Resource Server API 사용할 때 provider 부분 정보 사용해서 API 호츌
        provider: # OAuth2 공급자별 설정
          kakao:
            authorization_uri: https://kauth.kakao.com/oauth/authorize # 인증 요청 URI
            token_uri: https://kauth.kakao.com/oauth/token # 토큰 URI
            user-info-uri: https://kapi.kakao.com/v2/user/me # 사용자 정보 요청 URI
            user_name_attribute: id # 사용자 정보 식별 속성 (카카오는 id 사용)

          naver:
            authorization_uri: https://nid.naver.com/oauth2.0/authorize # 인증 요청 URI
            token_uri: https://nid.naver.com/oauth2.0/token # 토큰 URI
            user-info-uri: https://openapi.naver.com/v1/nid/me # 사용자 정보 요청 URI
            user_name_attribute: response # 사용자 정보담고 있는 최상위 JSON 키 (최상위 json 키 : response)

jwt:
  secret: ${JWT_SECRET}
